<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Rejane</title>

<style>
html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    display: flex; justify-content: center; align-items: center;
    text-align: center; overflow: hidden;
}

.container { max-width: 520px; padding: 30px; position: relative; z-index: 10; }

.text {
    font-size: clamp(18px, 4vw, 22px);
    line-height: 1.6; min-height: 120px;
    margin-bottom: 30px; transition: opacity 0.6s ease, transform 0.6s ease;
    opacity: 0;
    transform: translateY(20px);
}

#buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

button {
    padding: 12px 25px; border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.4);
    background: transparent; color: white;
    font-size: 16px; cursor: pointer; transition: all 0.3s ease;
}

button:hover { background: white; color: black; }

.big-heart {
    font-size: clamp(80px, 20vw, 110px);
    animation: pulseHeart 1.5s ease-in-out infinite;
    margin-bottom: 25px;
}

@keyframes pulseHeart {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

.bg-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: pulse 8s infinite ease-in-out alternate;
}

@keyframes pulse {
    0% { transform: translate(var(--x1), var(--y1)) scale(1); opacity: 0.6; }
    50% { transform: translate(var(--x2), var(--y2)) scale(1.2); opacity: 0.3; }
    100% { transform: translate(var(--x3), var(--y3)) scale(1); opacity: 0.5; }
}
</style>
</head>

<body>

<div class="bg-glow" style="width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%); --x1:0px; --y1:0px; --x2:20px; --y2:-30px; --x3:-15px; --y3:10px;"></div>
<div class="bg-glow" style="width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%); --x1:-50px; --y1:20px; --x2:40px; --y2:-40px; --x3:10px; --y3:30px;"></div>
<div class="bg-glow" style="width: 250px; height: 250px; background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%); --x1:30px; --y1:50px; --x2:-30px; --y2:-20px; --x3:20px; --y3:0px;"></div>

<div class="container">
    <div class="text" id="text"></div>
    <div id="buttons"></div>
</div>

<script>
const textElement = document.getElementById("text");
const buttonsContainer = document.getElementById("buttons");

function setMessage(msg, callback) {
    textElement.style.opacity = 0;
    textElement.style.transform = "translateY(20px)";
    setTimeout(() => {
        textElement.innerHTML = msg.replace(/\n/g, "<br>");
        textElement.style.opacity = 1;
        textElement.style.transform = "translateY(0)";
        if (callback) callback();
    }, 600);
}

function setButtons(buttonList) {
    buttonsContainer.innerHTML = "";
    buttonList.forEach(b => {
        const btn = document.createElement("button");
        btn.innerText = b.text;
        btn.onclick = b.action;
        buttonsContainer.appendChild(btn);
    });
}

// inicia automaticamente com step1
function start() {
    step1();
}

// funções do fluxo
function step1() {
    setMessage("Rejane...\n\nEra pra ser só mais uma conversa.\nMas não foi.", () => {
        setButtons([{ text: "Continuar", action: step2 }]);
    });
}

function step2() {
    setMessage("Você começou a aparecer nos meus pensamentos\nsem esforço.\nSem exagero.\nSó... naturalmente.", () => {
        setButtons([{ text: "E agora?", action: step3 }]);
    });
}

function step3() {
    setMessage("Eu não quero pressa.\nNem rótulos.\nNem promessas grandes.\n\nSó quero saber uma coisa.", () => {
        setButtons([{ text: "Qual?", action: question }]);
    });
}

function question() {
    setMessage("Você também sente que tem algo bonito acontecendo aqui?", () => {
        setButtons([
            { text: "Sim", action: yes },
            { text: "Ainda estou descobrindo", action: calm }
        ]);
    });
}

function showFinalMessage(finalMsg) {
    setMessage(finalMsg, () => {
        setButtons([{ text: "O que eu sinto por você?", action: showHeart }]);
    });
}

function yes() {
    showFinalMessage("Então vamos deixar acontecer.\nCom calma.\nCom verdade.\n\nEu gosto muito do que estamos vivendo.");
}

function calm() {
    showFinalMessage("E tudo bem.\nCoisas bonitas não precisam de pressa.\n\nSó estar perto de você já tem sido especial.");
}

function showHeart() {
    setButtons([]);
    textElement.style.opacity = 0;
    textElement.style.transform = "translateY(20px)";

    setTimeout(() => {
        textElement.innerHTML = `
            <div class="big-heart">❤️</div>
            <p style="font-size: 18px; margin-top: 10px;">Isso é para você.</p>
        `;
        textElement.style.opacity = 1;
        textElement.style.transform = "translateY(0)";
        setTimeout(() => {
            setButtons([{ text: "Recomeçar", action: () => location.reload() }]);
        }, 3000);
    }, 600);
}

window.onload = start;
</script>

</body>
</html>
